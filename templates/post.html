{% extends "index.html" %} {% block content %}
<section>
    <div class="Post">
        <h1 class="Post-title">{{ page.title }}</h1>
        <div class="Post-info">
            <span>{{ page.date }}</span>
            {% if page.extra.meetup_url or page.extra.meetup_id %}
            <span>
                <a
                    href="{% if page.extra.meetup_url %}{{ page.extra.meetup_url }}{% else %}{{ config.extra.meetup }}/{{ page.extra.meetup_id }}{% endif %}"
                    target="_blank"
                    rel="noopener nofollow"
                >
                    Link to Event
                </a>
            </span>
            {% endif %}
        </div>
        {% if page.extra.youtube_id %}
        <iframe
            width="560"
            height="315"
            src="https://www.youtube-nocookie.com/embed/{{ page.extra.youtube_id }}"
            frameborder="0"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
        ></iframe>
        {% endif %}

        <div class="Post-content">{{ page.content | safe }}</div>
    </div>
</section>
{% endblock content %}
